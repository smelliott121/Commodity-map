name: Update tanker rates
on:
  schedule:
    - cron: "20 7,13,19 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tankers
  cancel-in-progress: false
jobs:
  tankers:
    runs-on: ubuntu-latest
    steps:
      - name: Tanker charter rates reported in shipping news
        run: |
          mkdir -p out
          curl -sf "https://raw.githubusercontent.com/${{ github.repository }}/tankers/tankers.json" -o prev.json || echo "no previous file"
          python3 - <<'PY'
          # The official daily rates (Baltic Exchange) are paid. This collects the $/day figures quoted in shipping-news headlines instead.
          import json, re, time, html, datetime as dt, email.utils, urllib.request, urllib.parse
          import xml.etree.ElementTree as ET
          UA = {"User-Agent": "Mozilla/5.0 (commodity-map personal project)"}
          now = dt.datetime.now(dt.timezone.utc)
          def items(q):
              u = "https://news.google.com/rss/search?" + urllib.parse.urlencode({"q": q, "hl": "en-GB", "gl": "GB", "ceid": "GB:en"})
              for a in range(3):
                  try:
                      return list(ET.fromstring(urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=40).read()).iter("item"))
                  except Exception as e:
                      print("retry", e); time.sleep(4)
              return []
          CLS = [("VLCC", r"\bVLCCs?\b|supertanker|very large crude"), ("Suezmax", r"\bsuezmax"), ("Aframax/LR2", r"\baframax|\bLR2\b"), ("Product (MR/LR1)", r"\bMRs?\b|product tanker|\bLR1\b|clean tanker")]
          AMT = re.compile(r"(?:US)?\$\s?([\d][\d,]*(?:\.\d+)?)\s*(m\b|mn\b|million|k\b|thousand)?\s*(?:/|per|a|-a-|an)\s*-?\s*day", re.I)
          FC = re.compile(r"forecast|expect|project|guidance|could|may |outlook|predict|theoretical|potential", re.I)
          TANK = re.compile(r"tanker|vlcc|suezmax|aframax|\bLR2\b|\bMR\b|supertanker|freight", re.I)
          try:
              prev = json.load(open("prev.json"))
          except Exception:
              prev = {}
          pts = {(p["c"], p["d"], p["v"]): p for p in prev.get("pts", [])}
          news = {n["t"]: n for n in prev.get("news", [])}
          Q = ['(VLCC OR supertanker OR Suezmax OR Aframax) (rates OR "per day" OR "a day" OR "/day" OR earnings)',
               '("MR tanker" OR "product tanker" OR LR2 OR LR1 OR "clean tanker") (rates OR "per day" OR "a day" OR earnings)']
          wins = []
          if not prev.get("backfilled"):
              d0 = dt.date(2026, 1, 1)
              while d0 < now.date() - dt.timedelta(days=6):
                  wins.append(f" after:{d0.isoformat()} before:{(d0 + dt.timedelta(days=10)).isoformat()}"); d0 += dt.timedelta(days=10)
          wins.append(" when:3d")
          for w in wins:
              for q in Q:
                  for it in items(q + w):
                      t = html.unescape(it.findtext("title") or ""); src = (it.find("source").text if it.find("source") is not None else "") or ""
                      if src and t.endswith(" - " + src):
                          t = t[: -len(src) - 3]
                      if not TANK.search(t):
                          continue
                      try:
                          d = email.utils.parsedate_to_datetime(it.findtext("pubDate")).astimezone(dt.timezone.utc).date().isoformat()
                      except Exception:
                          continue
                      u = it.findtext("link") or ""
                      if (now.date() - dt.date.fromisoformat(d)).days <= 45:
                          news.setdefault(t, {"t": t[:170], "d": d, "u": u, "s": src[:40]})
                      m = AMT.search(t)
                      if not m:
                          continue
                      v = float(m.group(1).replace(",", "")); unit = (m.group(2) or "").lower()
                      v *= 1e6 if unit in ("m", "mn", "million") else 1e3 if unit in ("k", "thousand") else 1
                      if not 5000 <= v <= 3e6:
                          continue
                      pos = [(re.search(rx, t, re.I).start(), c) for c, rx in CLS if re.search(rx, t, re.I)]
                      if not pos:
                          continue
                      c = min(pos)[1]
                      k = (c, d, round(v))
                      if k not in pts:
                          pts[k] = {"c": c, "d": d, "v": round(v), "t": t[:170], "u": u, "s": src[:40], "fc": bool(FC.search(t))}
                  time.sleep(1.1)
          cut = (now - dt.timedelta(days=500)).date().isoformat()
          P = sorted((p for p in pts.values() if p["d"] >= cut), key=lambda p: p["d"])
          N = sorted((n for n in news.values() if n["d"] >= (now - dt.timedelta(days=45)).date().isoformat()), key=lambda n: n["d"], reverse=True)[:40]
          out = {"updated": int(time.time()), "backfilled": True, "pts": P, "news": N}
          print("rate points", len(P), {c: sum(1 for p in P if p["c"] == c) for c, _ in CLS}, "| latest", [(p["c"], p["d"], p["v"]) for p in P[-8:]])
          json.dump(out, open("out/tankers.json", "w"), separators=(",", ":"), ensure_ascii=False)
          PY
      - name: Publish to tankers branch
        run: |
          [ -f out/tankers.json ] || { echo "::warning::nothing built"; exit 0; }
          cd out
          git init -q && git checkout -q -b tankers
          git config user.name "tanker-bot"
          git config user.email "tanker-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Tanker rates"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tankers
