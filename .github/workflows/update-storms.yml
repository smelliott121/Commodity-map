name: Update storms
on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  storms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch tropical storms
        run: |
          python3 - <<'PY'
          import json, re, io, time, zipfile, datetime as dt, urllib.request
          UA = {"User-Agent": "commodity-map (github actions)"}
          def get(url, raw=False):
              r = urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60).read()
              return r if raw else json.loads(r)
          def coords(txt):
              out = []
              for t in txt.split():
                  p = t.split(",")
                  if len(p) >= 2:
                      out.append([round(float(p[0]), 2), round(float(p[1]), 2)])
              return out
          def kml_of(url):
              z = zipfile.ZipFile(io.BytesIO(get(url, True)))
              return "".join(z.read(n).decode("utf8", "ignore") for n in z.namelist() if n.lower().endswith(".kml"))
          storms = []
          ok_nhc = ok_gd = False
          try:
              cs = get("https://www.nhc.noaa.gov/CurrentStorms.json").get("activeStorms", [])
              ok_nhc = True
              for s in cs:
                  st = {"src": "NHC", "id": s.get("id"), "name": s.get("name"), "cls": s.get("classification"),
                        "kt": int(float(s.get("intensity") or 0)), "mb": s.get("pressure"),
                        "lat": s.get("latitudeNumeric"), "lon": s.get("longitudeNumeric"),
                        "dir": s.get("movementDir"), "spd": s.get("movementSpeed"),
                        "time": s.get("lastUpdate"), "url": (s.get("forecastGraphics") or {}).get("url"),
                        "track": [], "cone": [], "past": [], "fc": []}
                  try:
                      k = kml_of(s["forecastTrack"]["kmzFile"])
                      for blk in re.findall(r"<Placemark[^>]*>(.*?)</Placemark>", k, re.S):
                          pt = re.search(r"<Point>.*?<coordinates>(.*?)</coordinates>", blk, re.S)
                          if not pt:
                              continue
                          c = coords(pt.group(1))
                          if not c:
                              continue
                          kt = re.search(r"Maximum Wind:\D{0,60}?(\d{2,3})\s*(?:knots|kt)", blk)
                          vt = re.search(r"Valid at:\s*(?:</?t[dh][^>]*>\s*)*([^<\n]{6,60})", blk)
                          st["fc"].append({"p": c[0], "kt": int(kt.group(1)) if kt else None, "t": vt.group(1).strip() if vt else None})
                      ls = re.findall(r"<LineString>.*?<coordinates>(.*?)</coordinates>", k, re.S)
                      if ls:
                          st["track"] = max((coords(x) for x in ls), key=len)
                      else:
                          st["track"] = [c for x in re.findall(r"<Point>.*?<coordinates>(.*?)</coordinates>", k, re.S) for c in coords(x)]
                  except Exception as e:
                      print("track fail", st["name"], e)
                  try:
                      k = kml_of(s["trackCone"]["kmzFile"])
                      st["cone"] = [coords(x) for x in re.findall(r"<outerBoundaryIs>.*?<coordinates>(.*?)</coordinates>", k, re.S)]
                  except Exception as e:
                      print("cone fail", st["name"], e)
                  try:
                      k = kml_of(s["bestTrackGIS"]["kmzFile"])
                      ls = [coords(x) for x in re.findall(r"<LineString>.*?<coordinates>(.*?)</coordinates>", k, re.S)]
                      if ls:
                          pts = [c for seg in ls for c in seg]
                          st["past"] = pts[-120:]
                  except Exception as e:
                      print("best track fail", st["name"], e)
                  storms.append(st)
          except Exception as e:
              print("NHC fail", e)
          try:
              ev = get("https://www.gdacs.org/gdacsapi/api/events/geteventlist/SEARCH?eventlist=TC").get("features", [])
              ok_gd = True
              now = dt.datetime.utcnow()
              for f in ev:
                  p = f["properties"]
                  if p.get("iscurrent") != "true":
                      continue
                  try:
                      if now - dt.datetime.fromisoformat(p["todate"][:19]) > dt.timedelta(hours=30):
                          continue
                  except Exception:
                      pass
                  lon, lat = f["geometry"]["coordinates"][:2]
                  if p.get("source") == "NOAA" and any(abs(s["lat"] - lat) < 3 and abs(s["lon"] - lon) < 3 for s in storms):
                      continue
                  kmh = float((p.get("severitydata") or {}).get("severity") or 0)
                  st = {"src": "GDACS", "id": str(p.get("eventid")), "name": p.get("eventname", "").split("-")[0].title(),
                        "cls": "TC", "kt": round(kmh / 1.852), "lat": lat, "lon": lon, "time": p.get("todate"),
                        "alert": p.get("alertlevel"), "url": (p.get("url") or {}).get("report"), "track": [], "cone": [], "past": [], "fc": []}
                  try:
                      g = get(f"https://www.gdacs.org/gdacsapi/api/polygons/getgeometry?eventtype=TC&eventid={p['eventid']}&episodeid={p['episodeid']}")
                      pts = {}
                      for gf in g.get("features", []):
                          gp = gf["properties"]; geo = gf["geometry"]
                          if geo["type"] != "Polygon":
                              continue
                          ring = geo["coordinates"][0]
                          if gp.get("featuretype") == "WindRadii" and gp.get("Class") == "Poly_Green":
                              xs = [c[0] for c in ring]; ys = [c[1] for c in ring]
                              pts[gp.get("polygondate")] = [round((min(xs) + max(xs)) / 2, 2), round((min(ys) + max(ys)) / 2, 2)]
                          elif gp.get("polygonlabel") == "60 km/h" and not gp.get("featuretype"):
                              step = max(1, len(ring) // 300)
                              st["cone"].append([[round(c[0], 2), round(c[1], 2)] for c in ring[::step]])
                      ks = [k for k in sorted(pts) if k]
                      nowiso = dt.datetime.utcnow().isoformat()
                      st["past"] = [pts[k] for k in ks if k <= nowiso]
                      st["track"] = ([st["past"][-1]] if st["past"] else []) + [pts[k] for k in ks if k > nowiso]
                      st["fc"] = [{"p": pts[k], "kt": None, "t": k[:16].replace("T", " ") + " UTC"} for k in ks if k > nowiso]
                  except Exception as e:
                      print("gdacs geom fail", st["name"], e)
                  storms.append(st)
          except Exception as e:
              print("GDACS fail", e)
          print("storms:", [(s["name"], s["src"], s["kt"]) for s in storms])
          if ok_nhc or ok_gd:
              json.dump({"updated": int(time.time()), "storms": storms}, open("storms.json", "w"), separators=(",", ":"))
          PY
      - name: Commit if changed
        run: |
          git config user.name "storm-bot"
          git config user.email "storm-bot@users.noreply.github.com"
          git add storms.json || true
          git diff --cached --quiet || (git commit -m "Update storms" && git pull --rebase && git push)
