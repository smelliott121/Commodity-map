name: Update naval activity
on:
  schedule:
    - cron: "5 */4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: navy
  cancel-in-progress: false
jobs:
  navy:
    runs-on: ubuntu-latest
    steps:
      - name: Russian naval activity near the UK/Europe (reported) and US Navy deployments (USNI)
        run: |
          mkdir -p out
          curl -sf "https://raw.githubusercontent.com/${{ github.repository }}/navy/navy.json" -o prev.json || echo "no previous file"
          python3 - <<'PY'
          import json, re, time, html, datetime as dt, email.utils, urllib.request, urllib.parse
          import xml.etree.ElementTree as ET
          UA = {"User-Agent": "Mozilla/5.0 (commodity-map personal project)"}
          now = dt.datetime.now(dt.timezone.utc)
          def fetch(u, t=40):
              for a in range(3):
                  try:
                      return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=t).read()
                  except Exception as e:
                      print("retry", u[:80], e); time.sleep(4)
              return None
          # sea areas (approximate centre points; reports rarely give exact positions)
          AREA = [("english channel", "English Channel", 50.2, -1.5), ("dover", "Dover Strait", 51.0, 1.4), ("channel", "English Channel", 50.2, -1.5), ("north sea", "North Sea", 56.0, 3.0),
                  ("irish sea", "Irish Sea", 53.8, -5.0), ("shetland", "off Shetland", 60.6, -1.0), ("orkney", "off Orkney", 59.2, -2.5), ("moray firth", "Moray Firth", 57.9, -3.0),
                  ("scotland", "off Scotland", 58.0, -6.5), ("faroe", "Faroe Islands", 62.0, -7.0), ("iceland", "off Iceland", 64.5, -16.0), ("high north", "High North / Norwegian Sea", 68.0, 6.0),
                  ("norwegian sea", "Norwegian Sea", 68.0, 6.0), ("barents", "Barents Sea", 72.0, 35.0), ("baltic", "Baltic Sea", 57.0, 19.0), ("gulf of finland", "Gulf of Finland", 59.9, 26.0),
                  ("skagerrak", "Skagerrak", 57.9, 9.0), ("kattegat", "Kattegat", 56.8, 11.5), ("bay of biscay", "Bay of Biscay", 45.5, -5.0), ("biscay", "Bay of Biscay", 45.5, -5.0),
                  ("gibraltar", "Strait of Gibraltar", 35.95, -5.6), ("mediterranean", "Mediterranean", 36.0, 18.0), ("cornwall", "off Cornwall", 49.8, -5.5), ("south hams", "off Devon", 50.1, -3.8),
                  ("atlantic", "North Atlantic", 52.0, -20.0), ("arctic", "Arctic", 72.0, 20.0)]
          SHIP = re.compile(r"warship|frigate|corvette|destroyer|submarine|cruiser|intelligence (vessel|ship)|spy ship|research vessel|shadow fleet|tanker|flotilla|landing ship|tug|naval group", re.I)
          ACT = re.compile(r"shadow(s|ed|ing)?\b(?! fleet)|track|intercept|escort|monitor|tail|trail|seiz|board|detain|follow|spotted|sails? through|passes through|transit|warn|confront", re.I)
          RUS = re.compile(r"russia|russian|kremlin|putin", re.I)
          def area(t):
              tl = t.lower()
              for k, n, la, lo in AREA:
                  if k in tl and not (k == "channel" and ("news channel" in tl or "channel 4" in tl)):
                      return n, la, lo
              return None
          try:
              prev = json.load(open("prev.json"))
          except Exception:
              prev = {}
          ev = {(e["area"], e["d"]): e for e in prev.get("ru", [])}
          Q = ['(Russian OR Russia) (warship OR frigate OR corvette OR submarine OR "spy ship" OR "intelligence vessel" OR "shadow fleet") (shadowed OR tracked OR intercepted OR escorted OR monitored OR seized OR boarded)',
               '"Royal Navy" Russian (shadow OR shadows OR shadowed OR tracks OR intercepts OR escorts)']
          wins = []
          if not prev.get("backfilled"):
              d0 = dt.date(2026, 1, 1)
              while d0 < now.date() - dt.timedelta(days=6):
                  wins.append(f" after:{d0.isoformat()} before:{(d0 + dt.timedelta(days=14)).isoformat()}"); d0 += dt.timedelta(days=14)
          wins.append(" when:4d")
          for w in wins:
              for q in Q:
                  raw = fetch("https://news.google.com/rss/search?" + urllib.parse.urlencode({"q": q + w, "hl": "en-GB", "gl": "GB", "ceid": "GB:en"}))
                  if not raw:
                      continue
                  for it in ET.fromstring(raw).iter("item"):
                      t = html.unescape(it.findtext("title") or ""); src = (it.find("source").text if it.find("source") is not None else "") or ""
                      if src and t.endswith(" - " + src):
                          t = t[: -len(src) - 3]
                      if not (RUS.search(t) and SHIP.search(t) and ACT.search(t)):
                          continue
                      a = area(t)
                      if not a:
                          continue
                      try:
                          d = email.utils.parsedate_to_datetime(it.findtext("pubDate")).astimezone(dt.timezone.utc).date().isoformat()
                      except Exception:
                          continue
                      k = (a[0], d)
                      tank = bool(re.search(r"tanker|shadow fleet", t, re.I))
                      if k not in ev:
                          ev[k] = {"area": a[0], "lat": a[1], "lon": a[2], "d": d, "t": t[:170], "u": it.findtext("link") or "", "s": src[:40], "n": 1, "oil": tank}
                      else:
                          ev[k]["n"] = min(99, ev[k]["n"] + 1); ev[k]["oil"] = ev[k]["oil"] or tank
                  time.sleep(1.2)
          cut = (now - dt.timedelta(days=400)).date().isoformat()
          ru = sorted((e for e in ev.values() if e["d"] >= cut), key=lambda e: e["d"], reverse=True)
          # ---------- US Navy carrier and amphibious groups (USNI News Fleet and Marine Tracker, weekly) ----------
          PLACE = [("eastern mediterranean", 34.0, 30.0), ("mediterranean", 36.0, 18.0), ("arabian sea", 16.0, 63.0), ("gulf of oman", 24.5, 58.5), ("persian gulf", 27.0, 51.0), ("arabian gulf", 27.0, 51.0),
                   ("red sea", 20.0, 38.5), ("gulf of aden", 12.5, 47.0), ("bahrain", 26.2, 50.6), ("indian ocean", -5.0, 75.0), ("diego garcia", -7.3, 72.4), ("south china sea", 13.0, 114.0),
                   ("philippine sea", 18.0, 130.0), ("east china sea", 29.0, 125.0), ("sea of japan", 40.0, 135.0), ("yokosuka", 35.29, 139.67), ("sasebo", 33.16, 129.72), ("japan", 33.5, 133.0),
                   ("okinawa", 26.3, 127.8), ("guam", 13.4, 144.7), ("pearl harbor", 21.35, -157.95), ("hawaii", 21.3, -158.0), ("phuket", 7.88, 98.39), ("singapore", 1.26, 103.8),
                   ("philippines", 14.5, 120.5), ("australia", -33.0, 151.5), ("coral sea", -15.0, 155.0), ("north atlantic", 45.0, -35.0), ("atlantic", 35.0, -50.0), ("north sea", 56.0, 3.0),
                   ("norwegian sea", 68.0, 6.0), ("baltic", 57.0, 19.0), ("caribbean", 15.0, -72.0), ("gulf of mexico", 25.0, -90.0), ("san diego", 32.7, -117.2), ("norfolk", 36.95, -76.33),
                   ("virginia", 36.9, -76.0), ("mayport", 30.39, -81.4), ("bremerton", 47.56, -122.62), ("everett", 47.98, -122.22), ("eastern pacific", 18.0, -125.0), ("pacific", 25.0, -150.0),
                   ("rota", 36.62, -6.35), ("naples", 40.83, 14.25), ("souda", 35.49, 24.15), ("crete", 35.3, 24.8), ("cyprus", 34.9, 33.6), ("djibouti", 11.6, 43.15), ("strait of hormuz", 26.5, 56.3)]
          usni = {}
          raw = fetch("https://news.usni.org/category/fleet-tracker/feed", 60)
          if raw:
              try:
                  it = next(iter(ET.fromstring(raw).iter("item")))
                  c = it.find("{http://purl.org/rss/1.0/modules/content/}encoded").text or ""
                  txt = html.unescape(re.sub(r"<[^>]+>", "", re.sub(r"<h[1-6][^>]*>", "\n## ", re.sub(r"</p>|<br ?/?>", "\n", c))))
                  ships, sec = [], None
                  for line in txt.replace("\xa0", " ").split("\n"):
                      line = line.strip()
                      if line.startswith("## "):
                          sec = line[3:]; continue
                      for m in re.finditer(r"(USS [A-Z][\w.\- ]+?) \((CVN|LHA|LHD)-(\d+)\)", line):
                          if not re.search(r"\b(is|are|arrived|departed|operating|transiting|in port|returned|remains)\b", line):
                              continue
                          if any(s["ship"] == m.group(1) for s in ships):
                              continue
                          loc = None
                          for src in (line, sec or ""):
                              sl = src.lower()
                              hits = sorted((sl.find(k), -len(k), k, la, lo) for k, la, lo in PLACE if k in sl)
                              if hits:
                                  loc = hits[0][2:]; break
                          if loc:
                              ships.append({"ship": m.group(1).replace("  ", " "), "hull": f"{m.group(2)}-{m.group(3)}", "kind": "carrier" if m.group(2) == "CVN" else "amphibious", "where": loc[0].title(), "lat": loc[1], "lon": loc[2], "note": line[:220]})
                  usni = {"title": it.findtext("title"), "u": it.findtext("link"), "d": email.utils.parsedate_to_datetime(it.findtext("pubDate")).date().isoformat(), "ships": ships}
                  print("usni", usni["title"], [(s["ship"], s["where"]) for s in ships])
              except Exception as e:
                  print("usni parse", e)
          if not usni and prev.get("usni"):
              usni = prev["usni"]
          out = {"updated": int(time.time()), "backfilled": True, "ru": ru, "usni": usni}
          print("russian activity reports", len(ru), [(e["d"], e["area"]) for e in ru[:10]])
          json.dump(out, open("out/navy.json", "w"), separators=(",", ":"), ensure_ascii=False)
          PY
      - name: Publish to navy branch
        run: |
          [ -f out/navy.json ] || { echo "::warning::nothing built"; exit 0; }
          cd out
          git init -q && git checkout -q -b navy
          git config user.name "navy-bot"
          git config user.email "navy-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Naval activity"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" navy
