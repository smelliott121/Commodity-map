name: Update refining
on:
  schedule:
    - cron: "50 15 * * 3"
    - cron: "50 16 * * 3"
    - cron: "20 18 * * 4"
    - cron: "0 9 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refining:
    runs-on: ubuntu-latest
    steps:
      - name: Install Excel reader
        run: pip install --quiet xlrd==2.0.1
      - name: Fetch EIA weekly refinery and stocks data
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          mkdir -p out
          python3 - <<'PY'
          # Uses EIA's public history downloads (no key needed). If an EIA_API_KEY secret exists it is used as a fallback.
          import json, os, time, datetime as dt, urllib.request, xlrd
          S = {
              "util": ("WPULEUS3", "Refinery utilisation", "%"),
              "runs": ("WCRRIUS2", "Crude runs", "kb/d"),
              "crude": ("WCESTUS1", "Commercial crude stocks", "kb"),
              "cush": ("W_EPC0_SAX_YCUOK_MBBL", "Cushing crude stocks", "kb"),
              "gas": ("WGTSTUS1", "Gasoline stocks", "kb"),
              "dist": ("WDISTUS1", "Distillate stocks", "kb"),
          }
          UA = {"User-Agent": "Mozilla/5.0 (commodity-map personal project)"}
          since = dt.date.today() - dt.timedelta(days=7 * 330)
          K = os.environ.get("EIA_API_KEY", "").strip()
          def from_xls(sid, f="w", since=since):
              raw = urllib.request.urlopen(urllib.request.Request(f"https://www.eia.gov/dnav/pet/hist_xls/{sid}{f}.xls", headers=UA), timeout=60).read()
              book = xlrd.open_workbook(file_contents=raw)
              sh = book.sheet_by_name("Data 1") if "Data 1" in book.sheet_names() else book.sheet_by_index(1)
              pts = []
              for r in range(sh.nrows):
                  a, b = sh.cell_value(r, 0), sh.cell_value(r, 1) if sh.ncols > 1 else None
                  if isinstance(a, float) and isinstance(b, float):
                      d = xlrd.xldate_as_datetime(a, book.datemode).date()
                      if d >= since:
                          pts.append((d.isoformat(), b))
              return pts
          def from_api(sid):
              url = f"https://api.eia.gov/v2/seriesid/PET.{sid}.W?api_key={K}&start={since.isoformat()}&length=5000"
              j = json.load(urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60))
              return [(r["period"], float(r["value"])) for r in j["response"]["data"] if r.get("value") not in (None, "")]
          out = {"updated": int(time.time()), "s": {}}
          for k, (sid, name, unit) in S.items():
              pts = []
              for how in ("xls", "api"):
                  if how == "api" and not K:
                      continue
                  for a in range(3):
                      try:
                          pts = from_xls(sid) if how == "xls" else from_api(sid)
                          break
                      except Exception as e:
                          print("retry", k, how, str(e).replace(K, "***") if K else e); time.sleep(5)
                  if len(pts) >= 50:
                      break
              pts = sorted(set(pts))
              if len(pts) < 50:
                  print("not enough data for", k, len(pts)); continue
              out["s"][k] = {"n": name, "u": unit, "d": [p for p, _ in pts], "v": [v for _, v in pts]}
              print(k, len(pts), "latest", pts[-1])
          # crude oil moved by rail (monthly, thousand barrels -> kb/d), about 3 months behind
          RAIL = {"total": ("ESM_EPC0_RAIL_ZAMN-ZAMN_MBBL", "All US crude by rail"),
                  "canada": ("ESM_EPC0_RAIL_NUS-NCA_MBBL", "Canada to US by rail"),
                  "bakken_wc": ("ESM_EPC0_RAIL_R50-R20_MBBL", "Midwest (Bakken) to West Coast by rail")}
          rail = {}
          import calendar
          for k, (sid, name) in RAIL.items():
              for a in range(3):
                  try:
                      pts = from_xls(sid, "m", dt.date.today() - dt.timedelta(days=365 * 10))
                      pts = [(d[:7], round(v / calendar.monthrange(int(d[:4]), int(d[5:7]))[1], 1)) for d, v in pts]
                      if pts:
                          rail[k] = {"n": name, "u": "kb/d", "d": [p for p, _ in pts], "v": [v for _, v in pts]}
                          print("rail", k, len(pts), pts[-1])
                      break
                  except Exception as e:
                      print("retry rail", k, e); time.sleep(5)
          out["rail"] = rail
          if len(out["s"]) >= 3:
              json.dump(out, open("out/refining.json", "w"), separators=(",", ":"))
          PY
      - name: Publish to refining branch
        run: |
          [ -f out/refining.json ] || { echo "no refining data built"; exit 1; }
          cd out
          git init -q && git checkout -q -b refining
          git config user.name "refining-bot"
          git config user.email "refining-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Refining data"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" refining
