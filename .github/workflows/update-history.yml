name: Update price history
on:
  schedule:
    - cron: "35 22 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch 2 years of daily closes
        run: |
          mkdir -p out
          python3 - <<'PY'
          import json, time, urllib.request
          SYMS = ["CC=F","KC=F","ZW=F","HG=F","SB=F","ZC=F","CT=F","BZ=F","NG=F","ZS=F","GC=F","SI=F","PL=F","LBR=F","OJ=F","ZR=F","TIO=F","CL=F","ZL=F","DX-Y.NYB","^TNX","^VIX","000001.SS","BRL=X","CNY=X","HO=F","RB=F","PA=F","ALI=F","KE=F","ZM=F","ZO=F","LE=F","GF=F","HE=F","ZT=F","ZF=F","ZN=F","ZB=F","^IRX","^FVX","^TYX","ES=F","NQ=F","YM=F","RTY=F","^FTSE","^GDAXI","^STOXX50E","^N225","^HSI","EURUSD=X","GBPUSD=X","JPY=X","BDRY","BWET"]
          out = {}
          for s in SYMS:
              for host in ("query1", "query2"):
                  try:
                      url = f"https://{host}.finance.yahoo.com/v8/finance/chart/{s}?interval=1d&range=2y"
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      res = json.load(urllib.request.urlopen(req, timeout=30))["chart"]["result"][0]
                      ts = res.get("timestamp") or []
                      cl = res["indicators"]["quote"][0].get("close") or []
                      t, c = [], []
                      for a, b in zip(ts, cl):
                          if b is None:
                              continue
                          d = a // 86400
                          if t and t[-1] == d:
                              c[-1] = b
                              continue
                          t.append(d); c.append(float(f"{b:.6g}"))
                      if len(c) > 30:
                          out[s] = {"t": t, "c": c}
                          break
                  except Exception as e:
                      print("fail", s, host, e)
              time.sleep(0.6)
          print("got", len(out), "of", len(SYMS))
          if out:
              json.dump({"updated": int(time.time()), "s": out}, open("out/history.json", "w"), separators=(",", ":"))
          PY
      - name: Publish to hist branch
        run: |
          [ -f out/history.json ] || { echo "no history built"; exit 1; }
          cd out
          git init -q
          git checkout -q -b hist
          git config user.name "history-bot"
          git config user.email "history-bot@users.noreply.github.com"
          git add history.json
          git commit -q -m "Price history"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" hist
