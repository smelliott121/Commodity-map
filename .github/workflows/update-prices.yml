name: Update prices
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch delayed prices
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          SYMS = ["CC=F","KC=F","ZW=F","HG=F","SB=F","ZC=F","CT=F","BZ=F","NG=F","ZS=F","GC=F","SI=F","PL=F","LBR=F","OJ=F","ZR=F","TIO=F","CL=F","ZL=F","DX-Y.NYB","^TNX","^VIX","BRL=X","ZAR=X","CNY=X","INR=X","MYR=X","CAD=X","000001.SS","LIT","ITB","HO=F","RB=F","PA=F","ALI=F","KE=F","ZM=F","ZO=F","LE=F","GF=F","HE=F","ZT=F","ZF=F","ZN=F","ZB=F","^IRX","^FVX","^TYX","ES=F","NQ=F","YM=F","RTY=F","^FTSE","^GDAXI","^STOXX50E","^N225","^HSI","EURUSD=X","GBPUSD=X","JPY=X","BDRY","BWET"]
          out = {}
          for s in SYMS:
              for host in ("query1", "query2"):
                  try:
                      url = f"https://{host}.finance.yahoo.com/v8/finance/chart/{s}?interval=1d&range=1mo"
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      res = json.load(urllib.request.urlopen(req, timeout=20))["chart"]["result"][0]
                      m = res["meta"]
                      closes = [c for c in res["indicators"]["quote"][0].get("close", []) if c is not None]
                      price = m["regularMarketPrice"]
                      if closes and price and abs(price / closes[-1] - 1) > 0.15:
                          print("bad live quote, using last close:", s, price, "->", closes[-1])
                          price = closes[-1]
                      if len(closes) >= 2:
                          prev = closes[-2] if abs(closes[-1] - price) < 1e-9 * max(1, abs(price)) or len(closes) >= 2 and abs(closes[-1] / price - 1) < 0.0005 else closes[-1]
                      else:
                          prev = m.get("previousClose") or m["chartPreviousClose"]
                      out[s] = {"price": price, "prev": prev, "c": [float(f"{x:.6g}") for x in closes[-23:]]}
                      break
                  except Exception as e:
                      print("fail", s, host, e)
              time.sleep(0.3)
          print("got", len(out), "of", len(SYMS))
          if out:
              json.dump({"updated": int(time.time()), "prices": out}, open("prices.json", "w"), separators=(",", ":"))
          PY
      - name: Publish to prices branch
        run: |
          [ -f prices.json ] || { echo "no prices.json built"; exit 1; }
          mkdir -p pub && cp prices.json pub/ && cd pub
          git init -q && git checkout -q -b prices
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Update prices"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" prices
