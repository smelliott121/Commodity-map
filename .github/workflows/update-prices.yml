name: Update prices
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch delayed prices
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          SYMS = ["CC=F","KC=F","ZW=F","HG=F","SB=F","ZC=F","CT=F","BZ=F","NG=F","ZS=F","GC=F","SI=F","PL=F","LBR=F","OJ=F","ZR=F","TIO=F","CL=F","ZL=F","DX-Y.NYB","^TNX","^VIX","BRL=X","ZAR=X","CNY=X","INR=X","MYR=X","CAD=X","000001.SS","LIT","ITB"]
          out = {}
          for s in SYMS:
              for host in ("query1", "query2"):
                  try:
                      url = f"https://{host}.finance.yahoo.com/v8/finance/chart/{s}?interval=1d&range=5d"
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      res = json.load(urllib.request.urlopen(req, timeout=20))["chart"]["result"][0]
                      m = res["meta"]
                      closes = [c for c in res["indicators"]["quote"][0].get("close", []) if c is not None]
                      price = m["regularMarketPrice"]
                      if closes and price and abs(price / closes[-1] - 1) > 0.15:
                          print("bad live quote, using last close:", s, price, "->", closes[-1])
                          price = closes[-1]
                      if len(closes) >= 2:
                          prev = closes[-2] if abs(closes[-1] - price) < 1e-9 * max(1, abs(price)) or len(closes) >= 2 and abs(closes[-1] / price - 1) < 0.0005 else closes[-1]
                      else:
                          prev = m.get("previousClose") or m["chartPreviousClose"]
                      out[s] = {"price": price, "prev": prev}
                      break
                  except Exception as e:
                      print("fail", s, host, e)
          print("got", len(out), "of", len(SYMS))
          if out:
              json.dump({"updated": int(time.time()), "prices": out}, open("prices.json", "w"))
          PY
      - name: Commit if changed
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json || true
          git diff --cached --quiet || (git commit -m "Update prices" && git push)
