name: Probe sources
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Kalshi election markets
        run: |
          mkdir -p out
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, time
          B = "https://api.elections.kalshi.com/trade-api/v2/"
          def g(p):
              return json.load(urllib.request.urlopen(urllib.request.Request(B + p, headers={"User-Agent": "commodity-map personal"}), timeout=60))
          ev, cur, n = [], "", 0
          while n < 60:
              j = g("events?" + urllib.parse.urlencode({"limit": 200, "status": "open", "with_nested_markets": "true", **({"cursor": cur} if cur else {})}))
              for e in j.get("events", []):
                  t = (e.get("title", "") + " " + e.get("category", "")).lower()
                  if any(k in t for k in ("senate", "house", "congress", "governor", "midterm", "balance of power")):
                      ev.append({"et": e.get("event_ticker"), "st": e.get("series_ticker"), "title": e.get("title"), "cat": e.get("category"), "sub": e.get("sub_title"),
                                 "m": [{k: m.get(k) for k in ("ticker", "title", "subtitle", "yes_sub_title", "yes_bid", "yes_ask", "last_price", "volume", "volume_24h", "close_time", "status", "result")} for m in e.get("markets", [])]})
              cur = j.get("cursor"); n += 1
              if not cur: break
              time.sleep(.3)
          json.dump(ev, open("out/kalshi.json", "w"), indent=1)
          print("pages", n, "events", len(ev))
          PY
      - name: Publish
        run: |
          cd out && git init -q && git checkout -q -b probe && git config user.name probe && git config user.email probe@users.noreply.github.com && git add -A && git commit -q -m probe && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
