name: Probe sources
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: PSD and Pink Sheet
        run: |
          mkdir -p out
          pip install --break-system-packages -q openpyxl
          python3 - <<'PY'
          import urllib.request, zipfile, io, csv, json
          UA = {"User-Agent": "commodity-map personal project (github actions)"}
          rep = {}
          for f in ["psd_alldata_csv.zip", "psd_fruits_vegetables_csv.zip", "psd_citrus_csv.zip"]:
              try:
                  b = urllib.request.urlopen(urllib.request.Request("https://apps.fas.usda.gov/psdonline/downloads/" + f, headers=UA), timeout=300).read()
                  z = zipfile.ZipFile(io.BytesIO(b)); names = z.namelist(); com = {}
                  for nm in names:
                      for r in csv.DictReader(io.TextIOWrapper(z.open(nm), encoding="utf-8-sig", errors="ignore")):
                          c = r.get("Commodity_Description", "")
                          if "orange" in c.lower() or "juice" in c.lower():
                              k = (c, r["Country_Name"]); com.setdefault(c, {}).setdefault(r["Attribute_Description"], set()).add(r["Market_Year"])
                  rep[f] = {"size": len(b), "files": names, "orange": {c: {a: sorted(v)[-3:] for a, v in d.items()} for c, d in com.items()}}
              except Exception as e:
                  rep[f] = str(e)
          for u in ["https://thedocs.worldbank.org/en/doc/18675f1d1639c7a34d463f59263ba0a2-0050012025/related/CMO-Historical-Data-Monthly.xlsx",
                    "https://thedocs.worldbank.org/en/doc/5d903e848db1d1b83e0ec8f744e55570-0350012021/related/CMO-Historical-Data-Monthly.xlsx"]:
              try:
                  b = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=120).read()
                  import openpyxl
                  wb = openpyxl.load_workbook(io.BytesIO(b), read_only=True, data_only=True)
                  sh = wb["Monthly Prices"] if "Monthly Prices" in wb.sheetnames else wb[wb.sheetnames[0]]
                  rows = [[str(c) if c is not None else "" for c in r] for r in sh.iter_rows(min_row=1, max_row=9, values_only=True)]
                  last = None
                  for r in sh.iter_rows(values_only=True):
                      if r and r[0]: last = [str(c) for c in r[:80]]
                  rep[u] = {"sheets": wb.sheetnames, "head": rows, "last": last}
              except Exception as e:
                  rep[u] = str(e)
          json.dump(rep, open("out/probe.json", "w"), indent=1, default=str)
          PY
      - name: Publish
        run: |
          cd out && git init -q && git checkout -q -b probe && git config user.name probe && git config user.email probe@users.noreply.github.com && git add -A && git commit -q -m probe && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
