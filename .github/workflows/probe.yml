name: Probe sources
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: House wikitext
        run: |
          mkdir -p out
          python3 - <<'PY'
          import urllib.request, urllib.parse
          u = "https://en.wikipedia.org/w/api.php?" + urllib.parse.urlencode({"action": "parse", "page": "2026 United States House of Representatives elections", "prop": "wikitext", "format": "json", "formatversion": 2})
          open("out/house.json", "wb").write(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "commodity-map personal project (github actions)"}), timeout=60).read())
          PY
      - name: Publish
        run: |
          cd out && git init -q && git checkout -q -b probe && git config user.name probe && git config user.email probe@users.noreply.github.com && git add -A && git commit -q -m probe && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
