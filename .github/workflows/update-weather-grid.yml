name: Update weather grid
on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  grid:
    runs-on: ubuntu-latest
    steps:
      - name: Build global weather grid
        run: |
          mkdir -p out
          python3 - <<'PY'
          import json, math, time, urllib.request, urllib.parse
          STEP = 6
          lats = list(range(84, -85, -STEP))
          lons = list(range(-180, 180, STEP))
          pts = [(la, lo) for la in lats for lo in lons]
          FR = list(range(0, 73, 6))
          n = len(pts)
          T = [[0] * n for _ in FR]; P = [[0] * n for _ in FR]
          U = [[0] * n for _ in FR]; V = [[0] * n for _ in FR]
          times = None; got = 0; B = 100
          for b in range(0, n, B):
              chunk = pts[b:b + B]
              q = urllib.parse.urlencode({
                  "latitude": ",".join(str(p[0]) for p in chunk),
                  "longitude": ",".join(str(p[1]) for p in chunk),
                  "hourly": "temperature_2m,precipitation,wind_speed_10m,wind_direction_10m",
                  "past_hours": 6, "forecast_hours": 73,
                  "wind_speed_unit": "ms", "timezone": "UTC"})
              data = None
              for attempt in range(4):
                  try:
                      data = json.load(urllib.request.urlopen("https://api.open-meteo.com/v1/forecast?" + q, timeout=90))
                      break
                  except Exception as e:
                      print("retry", b, attempt, e); time.sleep(30)
              if data is None:
                  continue
              if isinstance(data, dict):
                  data = [data]
              for k, d in enumerate(data):
                  i = b + k; h = d["hourly"]
                  tt, pp, ss, dd = h["temperature_2m"], h["precipitation"], h["wind_speed_10m"], h["wind_direction_10m"]
                  if times is None:
                      times = [h["time"][6 + f] for f in FR]
                  for fi, f in enumerate(FR):
                      j = 6 + f
                      T[fi][i] = round(tt[j] if tt[j] is not None else 0)
                      P[fi][i] = round(10 * sum(x or 0 for x in pp[j - 5:j + 1]))
                      s = ss[j] or 0; a = math.radians(dd[j] or 0)
                      U[fi][i] = round(-10 * s * math.sin(a)); V[fi][i] = round(-10 * s * math.cos(a))
                  got += 1
              time.sleep(12)
          print("got", got, "of", n, "points")
          if got > n * 0.8 and times:
              json.dump({"updated": int(time.time()), "step": STEP, "lats": lats, "lons": lons, "times": times,
                         "t": T, "p": P, "u": U, "v": V}, open("out/grid.json", "w"), separators=(",", ":"))
          PY
      - name: Publish to data branch
        run: |
          [ -f out/grid.json ] || { echo "no grid built"; exit 1; }
          cd out
          git init -q
          git checkout -q -b data
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add grid.json
          git commit -q -m "Weather grid"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
