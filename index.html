:root[data-theme="dark"]{--bg:#14181a;--sea:#1b2a33;--land:#34402f;--ink:#e8ecee;--mut:#9aa5ab;--card:#20272b;--line:#fff3;--wet:#5aa9f0;--dry:#e0924f;--up:#5cc08a;--dn:#ee7a6d}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;padding:10px}
h1{font-size:17px;margin:0 0 2px}.sub{color:var(--mut);font-size:12px;margin-bottom:8px}
#bar{display:flex;gap:6px;align-items:center;margin-bottom:6px}
button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:15px}
#st{color:var(--mut);font-size:11px;margin-left:auto;text-align:right}

#map{position:relative;width:900px;aspect-ratio:2/1}
#map svg{position:absolute;inset:0;width:100%;height:100%}
.bd{fill:none;stroke:var(--line);stroke-width:.25;vector-effect:non-scaling-stroke}.land{fill:var(--land);stroke:var(--line);stroke-width:.3}.g{stroke:var(--line);stroke-width:.15;fill:none}
.pin{position:absolute;transform:translate(-50%,-100%);cursor:pointer}

.chip.wet{border-color:var(--wet)}.chip.dry{border-color:var(--dry)}
.dot{position:absolute;left:50%;top:100%;width:10px;height:10px;margin:-1px 0 0 -5px;border-radius:50%;background:var(--ink);opacity:.7}
.chip.smp span{opacity:.55;font-style:italic}.up{color:var(--up)}.dn{color:var(--dn)}

#panel h2{font-size:16px;margin:0 0 6px}.row{display:flex;justify-content:space-between;padding:3px 0;border-top:1px solid var(--line)}
.note{color:var(--mut);font-size:11px;margin-top:8px}
.ln{fill:none;stroke-width:1.8;vector-effect:non-scaling-stroke;opacity:.85}.pl{stroke-dasharray:6 3}
.hit{fill:none;stroke:transparent;stroke-width:16;vector-effect:non-scaling-stroke;pointer-events:stroke;cursor:pointer}
.mk{position:absolute;transform:translate(-50%,-50%);width:14px;height:14px;border:2px solid var(--ink);background:var(--card);cursor:pointer}
.mk::after{content:"";position:absolute;inset:-9px}
.mk.L-choke{border-color:#d33;border-radius:50%}.mk.L-ports{border-radius:3px}
.mk span{position:absolute;left:17px;top:-2px;white-space:nowrap;font-size:10px;display:none;color:var(--ink);text-shadow:0 0 3px var(--bg),0 0 3px var(--bg)}
#map.big .mk span{display:block}

.row{gap:12px}.row b{text-align:right}
#ld{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}.ln.hl{stroke-width:4;opacity:1}#map.hlmode .ln:not(.hl){opacity:.18}.kr{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);cursor:pointer}.kr i{flex:0 0 22px;height:0;border-top:3px solid;margin-top:9px}.kr.pl i{border-top-style:dashed}.kr b{display:block;font-size:13px}.kr small{color:var(--mut);display:block;font-size:11px;line-height:1.3}.kh{font-size:11px;color:var(--mut);margin:10px 0 2px;text-transform:uppercase;letter-spacing:.05em}

d[0].forEach(k=>{const m=MAC[k],q=PX[k];s+=`<div class="row"><span>${m[0]}<small class="dn2">${m[2]}</small></span><b>${q?f(q.price,m[1])+` <i class="${q.price>=q.prev?"up":"dn"}">${q.price>=q.prev?"▲":"▼"}${f(Math.abs((q.price/q.prev-1)*100))}%</i>`:"—"}</b></div>`});
return s+'<ul class="dl">'+d[1].map(x=>"<li>"+x+"</li>").join("")+"</ul>"}
function sig(r){const w=r.w;if(!w)return["","No weather data"];if(r.n=="Nat gas"){if(w.tn==null)return["","No temperature data"];if(r.ct==null)return["","Temperature normal not loaded yet"];const d=w.tn-r.ct,mo=new Date().getMonth()+1,win=mo>=10||mo<=3,sum=mo>=5&&mo<=9;if(Math.abs(d)<2.5)return["","Temperature close to normal"];if(d<0)return win?["cold","Colder than normal: heating demand up"]:["","Cooler than normal: little effect off-season"];return sum?["hot","Hotter than normal: cooling demand up"]:win?["","Milder than normal: heating demand down"]:["","Warmer than normal: little effect off-season"]}
if(r.nw)return["","Weather is a weak driver: see drivers below"];const n=r.cn;
if(n==null)return w.past>=60?["wet","Wet: heavy rain over last 7 days"]:(w.past<=5&&w.next<=5)?["dry","Dry: little rain past and next 7 days"]:["","Rainfall unremarkable (no seasonal data yet)"];
const d=w.past-n,pc=n>=5?Math.round(d/n*100):null;
if(w.past>n*1.5&&d>15)return["wet","Wet: "+(pc!=null?"+"+pc+"% vs normal":"well above normal")];
if(w.past<n*.5&&-d>15)return["dry","Dry: "+(pc!=null?pc+"% vs normal":"well below normal")];
return["","Close to normal for the season"]}
function show(i){const r=R[i],w=r.w,flag=sig(r)[1];
info(`<h2>${r.n} · ${r.loc}</h2>
<div class="row"><span>Price ${r.live?"(delayed)":"(SAMPLE)"}</span><b>${f(r.p,r.p<20?2:0)} ${r.u}</b></div>
${r.nw?"":`<div class="row"><span>Rain, last 7 days</span><b>${w?f(w.past)+" mm":"—"}${r.cn!=null?" (normal "+f(r.cn)+")":""}</b></div>
<div class="row"><span>Rain, next 7 days</span><b>${w?f(w.next)+" mm":"—"}${r.cx!=null?" (normal "+f(r.cx)+")":""}</b></div>
`}${r.nw&&r.n!="Nat gas"?"":`<div class="row"><span>Temp, next 7 days avg</span><b>${w&&w.tn!=null?f(w.tn)+"°C":"—"}${r.ct!=null?" (normal "+f(r.ct)+")":""}</b></div>
<div class="row"><span>Now</span><b>${w?f(w.t)+"°C · cloud "+f(w.cl,0)+"%":"—"}</b></div>
`}<div class="row"><span>Signal</span><b>${flag}</b></div>
${drv(r)}<div class="note">These are leading indicators, not guarantees: markets already price in forecasts.</div>`)}
R.forEach((r,i)=>paint(i));
let wOK=false,pOK=0;
async function weather(){try{const q=k=>R.map(r=>r[k]).join(",");
const j=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${q("lat")}&longitude=${q("lon")}&current=temperature_2m,cloud_cover&daily=precipitation_sum,temperature_2m_mean&past_days=7&forecast_days=7&timezone=auto`)).json();
const a=Array.isArray(j)?j:[j];a.forEach((d,i)=>{const s=d.daily.precipitation_sum,sum=x=>x.reduce((m,v)=>m+(v||0),0);
const tt=(d.daily.temperature_2m_mean||[]).slice(7,14).filter(v=>v!=null);R[i].w={tn:tt.length?tt.reduce((a,b)=>a+b,0)/tt.length:null,past:sum(s.slice(0,7)),next:sum(s.slice(7,14)),t:d.current.temperature_2m,cl:d.current.cloud_cover};paint(i)});wOK=true}catch(e){}}
let pT=0;
async function prices(){try{const j=await(await fetch("prices.json?t="+Date.now())).json();pT=j.updated;PX=j.prices;R.forEach((r,i)=>{const m=r.sym&&j.prices[r.sym];if(!m)return;r.p=m.price;r.ch=(m.price/m.prev-1)*100;r.live=1;pOK++;paint(i)})}catch(e){}}
async function climate(){try{const j=await(await fetch("climate.json?t="+Date.now())).json();R.forEach(r=>{const c=j.regions[r.n];if(c){r.cn=c.past;r.cx=c.next;r.ct=c.tnext}})}catch(e){}}
Promise.all([weather(),prices(),climate()]).then(()=>{R.forEach((r,i)=>paint(i));layout();$("#st").innerHTML=`Weather: ${wOK?"live":"unavailable here"}<br>Prices: ${pOK?"delayed, "+new Date(pT*1000).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"sample values"}`});
let z=1.5;map.style.width=900*z+"px";const zz=d=>{z=Math.min(3,Math.max(.7,z+d));map.style.width=900*z+"px";map.classList.toggle("big",z>=1.7);layout()};
$("#zi").onclick=()=>zz(.4);$("#zo").onclick=()=>zz(-.4);
$("#scroll").scrollLeft=900*z*0.38;
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
